AWSTemplateFormatVersion: "2010-09-09"
Description: SomaCue public certificate for CloudFront (must be in us-east-1). DNS validation record is created in the Route 53 zone.

Parameters:
  DomainName:
    Type: String
    Default: somacue.abhishekt.dev
  HostedZoneId:
    Type: String

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags: [{ Key: Project, Value: SomaCue }]

Outputs:
  CertificateArn:
    Value: !Ref Certificate
