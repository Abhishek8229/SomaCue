user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # No access log: request lines carry query strings and IPs of patients. Errors are logged.
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;     # uploads are limited to 20 MB by the app

  # Defines $origin_ok: 1 only when the request carries the secret X-Origin-Verify header that CloudFront adds.
  # The file is written to tmpfs at start by load-env.sh.
  include /run/somacue/origin-verify.conf;

  upstream somacue_app {
    server 127.0.0.1:3100;
    keepalive 16;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name origin.somacue.abhishekt.dev somacue.abhishekt.dev;

    ssl_certificate     /etc/letsencrypt/live/origin.somacue.abhishekt.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.somacue.abhishekt.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_tickets off;

    if ($origin_ok = 0) { return 403; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The app always sees the public name, so redirects, cookies and server-action origin checks match.
    proxy_set_header Host somacue.abhishekt.dev;
    proxy_set_header X-Forwarded-Host somacue.abhishekt.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;          # chat replies stream

    # Public files are not fingerprinted: let CloudFront keep them for a day.
    location ~ ^/(assets|models)/ {
      proxy_pass http://somacue_app;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
      proxy_pass http://somacue_app;
    }
  }
}
